<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webhook Router</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #0e1012;
    --surface: #16191d;
    --surface-2: #1d2126;
    --line: #2b3037;
    --text: #e6e8ea;
    --muted: #9098a1;
    --accent: #f0b429;
    --ok: #5bc98a;
    --bad: #ef6b62;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: flex-end;
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  h1 span { color: var(--accent); }

  .ingress {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .ingress code {
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 4px 8px;
  }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input, select, button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    min-height: 38px;
  }

  input[name="endpoint"] { width: min(460px, 60vw); }

  button {
    cursor: pointer;
    background: var(--surface-2);
  }

  button:hover { border-color: #3c434c; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1406;
    font-weight: 600;
  }

  button:disabled { opacity: 0.5; cursor: not-allowed; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .status {
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
    min-height: 40px;
  }

  .status[data-kind="error"] { color: var(--bad); }
  .status[data-kind="ok"] { color: var(--ok); }

  main {
    display: grid;
    grid-template-columns: minmax(280px, 42%) 1fr;
    min-height: calc(100vh - 250px);
  }

  .events {
    border-right: 1px solid var(--line);
    overflow: auto;
    max-height: calc(100vh - 250px);
  }

  .events-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    position: sticky;
    top: 0;
    background: var(--ink);
  }

  .events-head button { padding: 4px 8px; min-height: 28px; font-size: 11px; }

  ul { list-style: none; margin: 0; padding: 0; }

  li button {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 4px 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 10px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }

  li button[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }

  li .verb { color: var(--accent); }
  li .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .code { color: var(--muted); }
  li .code[data-outcome="ok"] { color: var(--ok); }
  li .code[data-outcome="bad"] { color: var(--bad); }
  li .time { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }

  .empty { padding: 24px 16px; color: var(--muted); max-width: 46ch; }

  .detail { overflow: auto; max-height: calc(100vh - 250px); padding: 20px 24px; }

  .detail h2 { font-size: 13px; margin: 0 0 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .detail h3 { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 20px 0 6px; }

  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }

  pre {
    margin: 0;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: auto;
    font-size: 12px;
    max-height: 320px;
  }

  footer { padding: 12px 24px; color: var(--muted); font-size: 12px; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .events { border-right: none; border-bottom: 1px solid var(--line); max-height: 40vh; }
    .detail { max-height: none; }
    input[name="endpoint"] { width: 100%; }
    .ingress { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Webhook <span>Router</span></h1>
  <div class="ingress">
    <span>Ingress</span>
    <code id="ingress-url"></code>
    <button type="button" id="copy-ingress">Copy</button>
  </div>
</header>

<form id="config-form">
  <div>
    <label for="endpoint">Forward to</label>
    <input id="endpoint" name="endpoint" type="url" required placeholder="https://example.com/hook">
  </div>
  <div>
    <label for="method">Method</label>
    <select id="method" name="method">
      <option>POST</option>
      <option>GET</option>
      <option>PUT</option>
      <option>PATCH</option>
      <option>DELETE</option>
      <option>HEAD</option>
      <option>OPTIONS</option>
    </select>
  </div>
  <button type="submit" class="primary">Save route</button>
</form>

<p class="status" id="status" role="status">Loading route…</p>

<main>
  <section class="events" aria-label="Received webhooks">
    <div class="events-head">
      <span id="count">0 requests</span>
      <button type="button" id="clear">Clear</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty">Nothing received yet. Point a webhook at the ingress URL above; each call appears here and is forwarded to the saved route.</p>
  </section>
  <section class="detail" aria-label="Request inspector" id="detail">
    <p class="empty">Select a request to inspect its headers and body.</p>
  </section>
</main>

<footer>Requests are held in memory only; the last 100 are kept.</footer>

<script>
const form = document.getElementById('config-form');
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const detailEl = document.getElementById('detail');
const countEl = document.getElementById('count');
const ingressEl = document.getElementById('ingress-url');

let events = [];
let selectedId = null;
let timer = null;

ingressEl.textContent = `${location.origin}/webhook`;

function setStatus(message, kind) {
  statusEl.textContent = message;
  if (kind) statusEl.dataset.kind = kind; else delete statusEl.dataset.kind;
}

function outcomeOf(event) {
  if (event.error) return 'bad';
  if (event.status && event.status >= 400) return 'bad';
  if (event.status) return 'ok';
  return 'none';
}

function renderList() {
  countEl.textContent = `${events.length} request${events.length === 1 ? '' : 's'}`;
  emptyEl.hidden = events.length > 0;
  listEl.replaceChildren(...events.map((event) => {
    const item = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('aria-current', String(event.id === selectedId));
    button.addEventListener('click', () => { selectedId = event.id; renderList(); renderDetail(); });

    const verb = document.createElement('span');
    verb.className = 'verb';
    verb.textContent = event.method;

    const path = document.createElement('span');
    path.className = 'path';
    path.textContent = event.path;

    const code = document.createElement('span');
    code.className = 'code';
    code.dataset.outcome = outcomeOf(event);
    code.textContent = event.error ? 'error' : event.status ?? '…';

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date(event.receivedAt).toLocaleTimeString();

    button.append(verb, path, code, time);
    item.append(button);
    return item;
  }));
}

function definition(term, value) {
  const dt = document.createElement('dt');
  dt.textContent = term;
  const dd = document.createElement('dd');
  dd.textContent = value;
  return [dt, dd];
}

function renderDetail() {
  const event = events.find((entry) => entry.id === selectedId);
  if (!event) {
    detailEl.innerHTML = '<p class="empty">Select a request to inspect its headers and body.</p>';
    return;
  }

  detailEl.replaceChildren();

  const title = document.createElement('h2');
  title.textContent = `${event.method} ${event.path}`;
  const meta = document.createElement('p');
  meta.className = 'empty';
  meta.textContent = `Received ${new Date(event.receivedAt).toLocaleString()} · forwarded to ${event.forwardedTo ?? 'nowhere'}`;
  detailEl.append(title, meta);

  const rows = document.createElement('dl');
  for (const [term, value] of [
    ['Result', event.error ? event.error : String(event.status ?? 'not forwarded')],
    ['Target', event.forwardedTo ?? 'none'],
    ['Content-Type', event.headers['content-type'] ?? 'none'],
    ['Content-Length', event.headers['content-length'] ?? String(event.body.length)]
  ]) rows.append(...definition(term, value));
  detailEl.append(rows);

  const headersTitle = document.createElement('h3');
  headersTitle.textContent = 'Headers';
  const headers = document.createElement('pre');
  headers.textContent = Object.entries(event.headers).map(([key, value]) => `${key}: ${value}`).join('\n');
  detailEl.append(headersTitle, headers);

  const bodyTitle = document.createElement('h3');
  bodyTitle.textContent = 'Body';
  const body = document.createElement('pre');
  body.textContent = event.body.length ? event.body : '(empty)';
  detailEl.append(bodyTitle, body);
}

async function loadConfig() {
  try {
    const response = await fetch('/api/config');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const config = await response.json();
    if (config.endpoint) {
      document.getElementById('endpoint').value = config.endpoint;
      document.getElementById('method').value = config.method;
      setStatus(`Forwarding to ${config.method} ${config.endpoint}`);
    } else {
      setStatus('No route saved yet. Incoming webhooks are recorded but not forwarded.');
    }
  } catch (error) {
    setStatus(`Could not read the saved route: ${error.message}`, 'error');
  }
}

async function loadEvents() {
  try {
    const response = await fetch('/api/events');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    events = await response.json();
    renderList();
    renderDetail();
    if (statusEl.dataset.kind === 'error' && statusEl.textContent.startsWith('Could not load')) {
      setStatus('Live updates resumed.');
    }
  } catch (error) {
    setStatus(`Could not load requests: ${error.message}`, 'error');
  }
}

form.addEventListener('submit', async (submitEvent) => {
  submitEvent.preventDefault();
  const data = new FormData(form);
  setStatus('Saving route…');
  try {
    const response = await fetch('/api/config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ endpoint: data.get('endpoint'), method: data.get('method') })
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error ?? `HTTP ${response.status}`);
    setStatus(`Forwarding to ${payload.method} ${payload.endpoint}`, 'ok');
  } catch (error) {
    setStatus(`Route not saved: ${error.message}`, 'error');
  }
});

document.getElementById('clear').addEventListener('click', async () => {
  await fetch('/api/events', { method: 'DELETE' });
  selectedId = null;
  loadEvents();
});

document.getElementById('copy-ingress').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(ingressEl.textContent);
    setStatus('Ingress URL copied.', 'ok');
  } catch {
    setStatus('Copy failed; select the URL and copy manually.', 'error');
  }
});

loadConfig();
loadEvents();
timer = setInterval(loadEvents, 2000);
</script>
</body>
</html>

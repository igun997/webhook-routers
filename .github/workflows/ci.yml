name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the pushed image
        run: |
          IMAGE_TAG="$(jq -r '.tags[0]' <<< '${{ steps.meta.outputs.json }}')"
          docker run -d --name smoke -p 3000:3000 "$IMAGE_TAG"
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -sf -o /dev/null -w 'ui=%{http_code}\n' http://127.0.0.1:3000/
          curl -sf -X POST http://127.0.0.1:3000/api/config \
            -H 'content-type: application/json' \
            -d '{"endpoint":"http://127.0.0.1:3000/","method":"POST"}' -o /dev/null -w 'config=%{http_code}\n'
          test "$(curl -s -X POST http://127.0.0.1:3000/webhook -d '{"ci":true}')" = '{"forwarded":true}'
          curl -s http://127.0.0.1:3000/api/events | grep -q '"body":"{\\"ci\\":true}"'
          docker rm -f smoke